document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

1B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Archivo';\n  font-style: normal;\n  font-weight: 600;\n  font-stretch: 100%;\n  font-display: swap;\n  src: url(\"20c0dfc8-3d7b-4b72-b8ec-33889bbe8efa\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Archivo';\n  font-style: normal;\n  font-weight: 600;\n  font-stretch: 100%;\n  font-display: swap;\n  src: url(\"301236d9-02f1-4df1-bef5-18f13dc807ac\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'Archivo';\n  font-style: normal;\n  font-weight: 800;\n  font-stretch: 100%;\n  font-display: swap;\n  src: url(\"321c60c5-fd9d-4f11-ab14-a9fd2a5b2865\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Archivo';\n  font-style: normal;\n  font-weight: 800;\n  font-stretch: 100%;\n  font-display: swap;\n  src: url(\"20c0dfc8-3d7b-4b72-b8ec-33889bbe8efa\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Archivo';\n  font-style: normal;\n  font-weight: 800;\n  font-stretch: 100%;\n  font-display: swap;\n  src: url(\"301236d9-02f1-4df1-bef5-18f13dc807ac\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n:root {\n  --color-bg: #f3f2f2;\n  --color-surface: #eae9e9;\n  --color-text: #201e1d;\n  --color-accent: #ec3013;\n  --color-accent-2: #e15b47;\n  --color-divider: color-mix(in srgb, #201e1d 40%, transparent);\n\n  /* Tonal ramps — generated in OKLCH on one shared lightness scale, so the\n     same step of any role matches the others in visual value. */\n  --color-neutral-100: #f8f4f4;\n  --color-neutral-200: #eae7e7;\n  --color-neutral-300: #d7d3d3;\n  --color-neutral-400: #bab6b6;\n  --color-neutral-500: #9b9797;\n  --color-neutral-600: #7d7979;\n  --color-neutral-700: #605d5d;\n  --color-neutral-800: #444141;\n  --color-neutral-900: #2d2b2b;\n\n  --color-accent-100: #fff2ef;\n  --color-accent-200: #ffe0d9;\n  --color-accent-300: #ffc4b8;\n  --color-accent-400: #ff9783;\n  --color-accent-500: #ff563c;\n  --color-accent-600: #dd2b0f;\n  --color-accent-700: #ae1800;\n  --color-accent-800: #7c1405;\n  --color-accent-900: #4d170e;\n\n  --color-accent-2-100: #fff2ef;\n  --color-accent-2-200: #ffe0da;\n  --color-accent-2-300: #ffc4b9;\n  --color-accent-2-400: #ff9784;\n  --color-accent-2-500: #ef6853;\n  --color-accent-2-600: #c94b39;\n  --color-accent-2-700: #9e3526;\n  --color-accent-2-800: #71261b;\n  --color-accent-2-900: #471d16;\n\n  --font-heading: \"Archivo\", system-ui, sans-serif;\n  --font-heading-weight: 800;\n  --font-body: \"Archivo\", system-ui, sans-serif;\n\n  --space-1: 4.0px;\n  --space-2: 8.0px;\n  --space-3: 12.0px;\n  --space-4: 16.0px;\n  --space-6: 24.0px;\n  --space-8: 32.0px;\n\n  --radius-sm: 0px;\n  --radius-md: 0px;\n  --radius-lg: 0px;\n\n  /* Elevation — derived from the ground: soft ink-tinted shadows on a\n     light theme, a hairline edge + ambient darkness on a dark one. */\n  --shadow-sm: 0 1px 2px color-mix(in srgb, #2d2b2b 14%, transparent);\n  --shadow-md: 0 3px 10px color-mix(in srgb, #2d2b2b 16%, transparent);\n  --shadow-lg: 0 12px 32px color-mix(in srgb, #2d2b2b 22%, transparent);\n}\n\nbody {\n  background: var(--color-bg);\n  color: var(--color-text);\n  font-family: var(--font-body);\n}\nh1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }\n\n.grayscale{filter:grayscale(1) contrast(1.08)}\n\n/* ══════════════════════════════════════════════════════════════════════════\n   Components — built with the tokens above. Plain CSS\n   on plain HTML: no JavaScript, no build step. Each class is documented in\n   readme.md and demonstrated in foundations/ and components/.\n   ══════════════════════════════════════════════════════════════════════ */\n\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);\n}\nh1 { font-size: 42px; }\nh2 { font-size: 32px; }\nh3 { font-size: 25px; }\nh4 { font-size: 20px; }\nh5 { font-size: 16px; }\nh6 { font-size: 13px; }\nh6 { letter-spacing: 0.08em; text-transform: uppercase; }\np { margin: 0 0 var(--space-3); }\na { color: var(--color-accent); text-underline-offset: 3px; }\nimg { display: block; max-width: 100%; }\nfigure { margin: 0; }\nfigcaption {\n  font-size: 11px; margin-top: var(--space-1);\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }\n:focus { outline: none; }\n:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }\n\n/* — rules — */\n.hr {\n  height: 2px; border: 0; margin: var(--space-4) 0;\n  background: var(--color-divider);\n}\n\n/* — buttons — */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  cursor: pointer; text-decoration: none;\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —\n     the pair sits side by side in sign-up rows */\n  background: transparent; border: 1px solid transparent;\n  padding: var(--space-2) calc(var(--space-3) * 1.2);\n  border-radius: var(--radius-md);\n}\n.btn svg { display: block; }\n.btn:disabled { opacity: 0.45; cursor: not-allowed; }\n.btn-primary { background: var(--color-accent); color: var(--color-bg); }\n.btn-primary:hover { background: var(--color-accent-600); }\n.btn-primary:active { background: var(--color-accent-700); }\n.btn-secondary { border-color: var(--color-divider); }\n.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 36px; height: 36px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); justify-content: flex-start; text-align: left; }\n\n/* — forms — */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: var(--color-surface);\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }\n.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }\ntextarea.input { min-height: 90px; resize: vertical; }\n.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }\n.radio input, .seg-opt input {\n  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;\n}\n.radio .dot {\n  width: 16px; height: 16px; flex: none; border-radius: 50%;\n  border: 1.5px solid var(--color-divider);\n}\n.radio:hover .dot { border-color: var(--color-accent); }\n.radio input:checked + .dot {\n  border-color: var(--color-accent); background: var(--color-accent);\n  box-shadow: inset 0 0 0 4px var(--color-bg);\n}\n.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n.seg {\n  display: inline-flex; overflow: hidden;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.seg-opt {\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 7px 12px; font-size: 13px; cursor: pointer;\n}\n.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }\n.seg-opt:has(input:checked) { background: var(--color-accent); color: var(--color-bg); }\n.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }\n\n/* — cards — */\n.card {\n  display: flex; flex-direction: column; gap: var(--space-2);\n  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);\n}\n.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }\n.card-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 17px; line-height: 1.2;\n}\n.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }\n.card-meta {\n  display: flex; align-items: center; gap: 6px; font-size: 11px;\n  color: color-mix(in srgb, var(--color-text) 50%, transparent);\n}\n.elev-sm { box-shadow: var(--shadow-sm); }\n.elev-md { box-shadow: var(--shadow-md); }\n.elev-lg { box-shadow: var(--shadow-lg); }\n\n/* — tags — */\n.tag {\n  display: inline-flex; align-items: center; font-size: 11px;\n  letter-spacing: 0.02em; padding: 3px 10px;\n  border-radius: calc(var(--radius-md) * 0.75);\n}\n.tag-accent { background: var(--color-accent-100); color: var(--color-accent-800); }\n.tag-accent-2 { background: var(--color-accent-2-100); color: var(--color-accent-2-800); }\n.tag-neutral { background: var(--color-neutral-100); color: var(--color-neutral-800); }\n.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }\n\n/* — navigation — */\n.nav {\n  display: flex; align-items: center; gap: var(--space-4);\n  padding: var(--space-3) var(--space-4);\n  border-bottom: 2px solid var(--color-divider);\n}\n.nav-brand {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 18px; margin-right: auto;\n}\n.nav a { color: inherit; text-decoration: none; font-size: 14px; }\n.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }\n\n/* — tables — */\n.table { width: 100%; border-collapse: collapse; font-size: 14px; }\n.table th {\n  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;\n  color: color-mix(in srgb, var(--color-text) 60%, transparent);\n  padding: var(--space-2); border-bottom: 2px solid var(--color-divider);\n}\n.table td {\n  padding: var(--space-2);\n  border-bottom: 1px solid var(--color-divider);\n}\n.table tbody tr:hover { background: color-mix(in srgb, var(--color-text) 4%, transparent); }\n\n/* — dialog — */\n.dialog-backdrop {\n  position: fixed; inset: 0; display: grid; place-items: center;\n  padding: var(--space-4);\n  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);\n}\n.dialog {\n  width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-3);\n  padding: lt(); this.setState({ sOpen: true, q: '', sIdx: 0 }); return; }\n      if (this.state.mode === 'steps' && this.state.at !== 'home') {\n        const seq = this.seq(), i = seq.indexOf(this.state.at);\n        if (e.key === 'ArrowRight' && seq[i + 1]) this.go(seq[i + 1]);\n        if (e.key === 'ArrowLeft' && seq[i - 1]) this.go(seq[i - 1]);\n      }\n    };\n    window.addEventListener('keydown', this.onKey);\n    this.onHash = () => this.goHash();\n    window.addEventListener('hashchange', this.onHash);\n    document.body.dataset.theme = this.state.theme;\n  }\n  componentWillUnmount() { clearInterval(this.tick); clearTimeout(this.wt); window.removeEventListener('keydown', this.onKey); window.removeEventListener('hashchange', this.onHash); this.save(); }\n\n  init() {\n    const L = window.LAB; this.L = L; this.U = {}; this.S = {}; this.KEY = 'lab-redesign-v1:' + (L.slug || 'lab'); try { document.title = L.title; } catch (e) {}\n    if (L.accent) this.applyAccent(L.accent);\n    L.units.forEach(u => (this.U[u.key] = u));\n    L.sessions.forEach(s => (this.S[s.n] = s));\n    this.allKeys = [...L.units.filter(u => u.kind === 'theory'), ...L.units.filter(u => u.kind === 'step'), ...L.units.filter(u => u.kind === 'ref')].map(u => u.key);\n    const gl = { theory: 'Теория', step: 'Шаги', ref: 'Справка' };\n    this.index = L.units.map(u => ({ id: 'u:' + u.key, group: gl[u.kind], num: u.num, title: u.title, t: u.title.toLowerCase(), x: (u.text || '').toLowerCase(), raw: u.text || '' }));\n    ((L.glossKey && this.U[L.glossKey].gloss) || []).forEach(g => this.index.push({ id: 'u:' + L.glossKey, group: 'Глоссарий', num: '', title: g.term, t: g.term.toLowerCase(), x: g.def.toLowerCase(), raw: g.def, gloss: true }));\n    let saved = {};\n    try { saved = JSON.parse(localStorage.getItem(this.KEY) || '{}'); } catch (e) {}\n    const keep = {};\n    ['done', 'quiz', 'last', 'mode', 'theme', 'tSess', 'tTotal'].forEach(k => saved[k] !== undefined && (keep[k] = saved[k]));\n    this.setState({ ready: true, ...keep }, () => this.goHash());\n  }\n  applyAccent(hex) {\n    const toRgb = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));\n    const mix = (a, b, t) => a.map((v, i) => Math.round(v + (b[i] - v) * t));\n    const lum = c => { const f = c.map(v => { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); }); return 0.2126 * f[0] + 0.7152 * f[1] + 0.0722 * f[2]; };\n    const onWhite = c => 1.05 / (lum(c) + 0.05);\n    const hexOf = c => '#' + c.map(v => v.toString(16).padStart(2, '0')).join('');\n    let base = toRgb(hex);\n    for (let i = 0; i < 12 && onWhite(base) < 3.6; i++) base = mix(base, [0, 0, 0], 0.08);\n    const W = [255, 255, 255], K = [0, 0, 0];\n    let ink = base; for (let i = 0; i < 20 && (lum([243, 242, 242]) + 0.05) / (lum(ink) + 0.05) < 5; i++) ink = mix(ink, K, 0.07);\n    const ramp = {\n      '--color-accent': hexOf(base), '--color-accent-500': hexOf(base),\n      '--color-accent-100': hexOf(mix(base, W, 0.88)), '--color-accent-200': hexOf(mix(base, W, 0.75)),\n      '--color-accent-300': hexOf(mix(base, W, 0.5)), '--color-accent-400': hexOf(mix(base, W, 0.25)),\n      '--color-accent-600': hexOf(mix(base, K, 0.15)), '--color-accent-700': hexOf(ink),\n      '--color-accent-800': hexOf(mix(ink, K, 0.3)), '--color-accent-900': hexOf(mix(ink, K, 0.55))\n    };\n    const r = document.documentElement.style, b = document.body.style;\n    Object.entries(ramp).forEach(([k, v]) => { r.setProperty(k, v); b.setProperty(k, v); });\n  }\n  save() {\n    const { done, quiz, last, mode, theme, tSess, tTotal } = this.state;\n    try { localStorage.setItem(this.KEY, JSON.stringify({ done, quiz, last, mode, theme, tSess, tTotal })); } catch (e) {}\n  }\n  componentDidUpdate(pp) {\n    const s = this.state, ps = this.__ps || {};\n    this.__ps = s;\n    document.body.dataset.theme = s.theme;\n    if (['done', 'quiz', 'last', 'mode', 'theme'].some(k => ps[k] !== s[k])) this.save();\n    if (!ps.sOpen && s.sOpen) setTimeout(() => this.searchRef.current?.focus(), 0);\n    if (this.pendingScroll) { const id = this.pendingScroll; this.pendingScroll = null; requestAnimationFrame(() => this.scrollToId(id)); }\n    if (this.pendingTop) { this.pendingTop = false; if (this.scrollRef.current) this.scrollRef.current.scrollTop = 0; }\n  }\n\n  posters() { return this.props.posters ?? true; }\n  strict() { return this.props.strictGate ?? true; }\n  seq() {\n    const L = this.L, ids = [];\n    L.units.filter(u => u.kind === 'theory').forEach(u => ids.push('u:' + u.key));\n    L.sessions.forEach(s => { if (this.posters()) ids.push('p:' + s.n); s.steps.forEach(k => ids.push('u:' + k)); });\n    L.units.filter(u => u.kind === 'ref').forEach(u => ids.push('u:' + u.key));\n    return ids;\n  }\n  group(id) {\n    if (!id || id === 'home') return null;\n    if (id[0] === 'p') return +id.slice(2);\n    const u = this.U[id.slice(2)];\n    return u.kind === 'step' ? u.session : u.kind === 'theory' ? 'T' : 'R';\n  }\n  gKeys(g) {\n    if (g === 'T') return this.L.units.filter(u => u.kind === 'theory').map(u => u.key);\n    if (g === 'R') return this.L.units.filter(u => u.kind === 'ref').map(u => u.key);\n    return this.S[g].steps;\n  }\n  firstUndone(keys) { return keys.find(k => !this.state.done[k]) || keys[0]; }\n  dom(id) { return 'x-' + id.replace(':', '-'); }\n  go(id) {\n    if (id === 'home') { this.setState({ at: 'home', pop: null, sOpen: false }); return; }\n    if (id[0] === 'p' && !this.posters()) id = 'u:' + this.S[+id.slice(2)].steps[0];\n    if (this.state.mode === 'feed') this.pendingScroll = id; else this.pendingTop = true;\n    this.setState({ at: id, last: id, pop: null, sOpen: false });\n  }\n  goHash() {\n    const h = decodeURIComponent((window.location.hash || '').slice(1));\n    if (h && this.U && this.U[h]) this.go('u:' + h);\n  }\n  scrollToId(id) {\n    const sc = this.scrollRef.current, el = document.getElementById(this.dom(id));\n    if (!sc || !el) return;\n    this.spyLock = true;\n    sc.scrollTop = el.getBoundingClientRect().top - sc.getBoundingClientRect().top + sc.scrollTop;\n    setTimeout(() => (this.spyLock = false), 150);\n  }\n  spy() {\n    const sc = this.scrollRef.current; if (!sc) return;\n    const top = sc.getBoundingClientRect().top; let cur = null;\n    for (const id of this.seq()) {\n      const el = document.getElementById(this.dom(id)); if (!el) continue;\n      if (el.getBoundingClientRect().top - top <= 140) cur = id; else break;\n    }\n    if (cur && cur !== this.state.at) this.setState({ at: cur, last: cur });\n  }\n  gateOk(key) {\n    if (!this.strict()) return true;\n    const u = this.U[key]; if (!u.quiz || !u.quiz.length) return true;\n    const q = this.state.quiz[key] || [];\n    return u.quiz.every((_, i) => q[i]);\n  }\n  mark(key, v) { this.setState(s => ({ done: { ...s.done, [key]: v } })); }\n  toggleQ(key, i) { this.setState(s => { const q = [...(s.quiz[key] || [])]; q[i] = !q[i]; return { quiz: { ...s.quiz, [key]: q } }; }); }\n  el(k, html, tag) {\n    if (!this.els.has(k)) this.els.set(k, React.createElement(tag || 'div', { key: k, dangerouslySetInnerHTML: { __html: html } }));\n    return this.els.get(k);\n  }\n  fmt(t) { const p = n => String(n).padStart(2, '0'); return `${p(Math.floor(t / 3600))}:${p(Math.floor(t / 60) % 60)}:${p(t % 60)}`; }\n  plural(n, a, b, c) { const m = n % 10, h = n % 100; return m === 1 && h !== 11 ? a : m >= 2 && m <= 4 && (h < 12 || h > 14) ? b : c; }\n  short(t, n) { return t.length > n ? t.slice(0, n - 1).trim() + '…' : t; }\n  label(id) {\n    if (!id) return '';\n    if (id[0] === 'p') return 'Сессия ' + id.slice(2);\n    const u = this.U[id.slice(2)];\n    return u.num + ' ' + this.short(u.title, 34);\n  }\n\n  vmUnit(id, feed) {\n    if (id[0] === 'p') {\n      const s = this.S[+id.slice(2)], dn = s.steps.filter(k => this.state.done[k]).length;\n      return { isPosterItem: true, isDoc: false, isStep: false, domId: this.dom(id), n: s.n, nn: String(s.n).padStart(2, '0'), title: s.title, dur: s.dur, cnt: `${dn} из ${s.steps.length}` };\n    }\n    const key = id.slice(2), u = this.U[key], done = !!this.state.done[key], ok = this.gateOk(key);\n    const base = {\n      isPosterItem: false, domId: this.dom(id), done, showInlineMark: feed,\n      markLabel: done ? '✓ Пройдено — снять отметку' : u.kind === 'step' ? 'Шаг пройден' : 'Раздел прочитан',\n      markDisabled: !done && !ok, onMark: () => this.mark(key, !done),\n      markBg: done ? 'var(--ink)' : ok ? 'var(--color-accent)' : 'var(--hair)',\n      markInk: done ? 'var(--paper)' : ok ? '#fff' : 'var(--muted)',\n      markHint: !done && !ok ? 'Сначала отметьте вопросы «Проверь себя»' : ''\n    };\n    if (u.kind !== 'step') {\n      return { ...base, isDoc: true, isStep: false, num: u.num, title: u.title, kicker: u.kind === 'theory' ? `Теория · раздел ${u.num}` : 'Справка', el: this.el(key, u.html) };\n    }\n    const s = this.S[u.session], idx = s.steps.indexOf(key), q = this.state.quiz[key] || [];\n    const qd = u.quiz.filter((_, i) => q[i]).length;\n    return {\n      ...base, isDoc: false, isStep: true, num: u.num, title: u.title,\n      kicker: `Сессия ${s.n} · шаг ${idx + 1} из ${s.steps.length}`,\n      introEl: this.el(key + ':i', u.intro),\n      hasResult: !!u.result, resultEl: u.result ? this.el(key + ':r', u.result) : null,\n      hasWhy: !!u.why, whyEl: u.why ? this.el(key + ':w', u.why) : null,\n      deep: u.deep.map((d, i) => ({ summary: d.summary, el: this.el(key + ':d' + i, d.html) })),\n      hasQuiz: u.quiz.length > 0, quizCount: `${qd} из ${u.quiz.length}`,\n      quiz: u.quiz.map((h, i) => ({ el: this.el(key + ':q' + i, h, 'span'), onToggle: () => this.toggleQ(key, i), boxBg: q[i] ? 'var(--ink)' : 'transparent', mark: q[i] ? '✓' : '', ink: q[i] ? 'var(--muted)' : 'var(--ink)' })),\n      hasOutro: !!u.outro, outroLabel: u.outro ? u.outro.label : '', outroEl: u.outro ? this.el(key + ':o', u.outro.html) : null\n    };\n  }\n\n  renderVals() {\n    const st = this.state;\n    if (!st.ready) return { loading: true, isHome: false, isApp: false, searchOpen: false, theoryCells: [], sessCells: [], refCells: [], rail: [], tabs: [], ticks: [], shown: [], results: [], p: {}, f: {}, scrollRef: this.scrollRef, searchRef: this.searchRef };\n    const L = this.L, seq = this.seq(), feed = st.mode === 'feed', dark = st.theme === 'dark';\n    const doneCount = this.allKeys.filter(k => st.done[k]).length, total = this.allKeys.length;\n    const thU = L.units.filter(u => u.kind === 'theory'), rfU = L.units.filter(u => u.kind === 'ref');\n    const range = a => a.length ? (a.length > 1 ? `разделы ${a[0].num}–${a[a.length - 1].num}` : `раздел ${a[0].num}`) : '';\n    const nextUndone = () => { const k = this.allKeys.find(k => !st.done[k]); return k ? 'u:' + k : seq[0]; };\n    const contId = st.last || nextUndone();\n    const common = {\n      loading: false, isDark: dark, isLight: !dark,\n      totalT: this.fmt(st.tTotal), sessT: this.fmt(st.tSess),\n      toggleTheme: () => this.setState({ theme: dark ? 'light' : 'dark' }),\n      themeLabel: dark ? 'Светлая тема' : 'Тёмная тема',\n      openSearch: () => this.setState({ sOpen: true, q: '', sIdx: 0 }),\n      goHome: () => this.go('home'),\n      scrollRef: this.scrollRef, searchRef: this.searchRef\n    };\n\n    // search\n    let results = [];\n    if (st.sOpen) {\n      const q = st.q.trim().toLowerCase();\n      if (!q) {\n        results = this.allKeys.filter(k => !st.done[k]).slice(0, 6).map(k => ({ ...this.index.find(e => e.id === 'u:' + k), group: 'Дальше' }));\n      } else {\n        results = this.index.map((e, i) => {\n          let sc = 0;\n          if (e.num && e.num === q) sc = 5; else if (e.num && e.num.startsWith(q)) sc = 4;\n          else if (e.t.includes(q)) sc = 3; else if (e.x.includes(q)) sc = 1;\n          return { e, sc, i };\n        }).filter(r => r.sc).sort((a, b) => b.sc - a.sc || a.i - b.i).slice(0, 12).map(r => {\n          let snip = r.e.gloss ? r.e.raw : '';\n          if (!snip && r.sc === 1) { const p = r.e.x.indexOf(q); snip = (p > 30 ? '…' : '') + r.e.raw.slice(Math.max(0, p - 30), p + 90); }\n          return { ...r.e, snip };\n        });\n      }\n    }\n    const sIdx = Math.min(st.sIdx, Math.max(0, results.length - 1));\n    const searchVals = {\n      searchOpen: st.sOpen, q: st.q, noResults: st.sOpen && !results.length,\n      searchHint: st.q.trim() ? `${results.length} ${this.plural(results.length, 'результат', 'результата', 'результатов')}` : 'Следующие непройденные',\n      onQ: e => this.setState({ q: e.target.value, sIdx: 0 }),\n      onSearchKey: e => {\n        if (e.key === 'ArrowDown') { e.preventDefault(); this.setState({ sIdx: Math.min(sIdx + 1, results.length - 1) }); }\n        else if (e.key === 'ArrowUp') { e.preventDefault(); this.setState({ sIdx: Math.max(sIdx - 1, 0) }); }\n        else if (e.key === 'Enter' && results[sIdx]) this.go(results[sIdx].id);\n        else if (e.key === 'Escape') this.setState({ sOpen: false });\n      },\n      closeSearch: () => this.setState({ sOpen: false }),\n      stop: e => e.stopPropagation(),\n      results: results.map((r, i) => ({\n        group: r.group, num: r.num, title: r.title, snip: r.snip || '',\n        bg: i === sIdx ? 'var(--ink)' : 'transparent', ink: i === sIdx ? 'var(--paper)' : 'var(--ink)',\n        onClick: () => this.go(r.id), onHover: () => i !== sIdx && this.setState({ sIdx: i })\n      }))\n    };\n\n    if (st.at === 'home') {\n      const cell = (u) => {\n        const d = !!st.done[u.key];\n        return { num: u.num, title: u.title, mark: d ? '✓' : '', bg: 'transparent', numInk: d ? 'var(--muted)' : 'var(--ink)', onClick: () => this.go('u:' + u.key) };\n      };\n      const th = L.units.filter(u => u.kind === 'theory'), rf = L.units.filter(u => u.kind === 'ref');\n      const stepsDone = L.sessions.reduce((a, s) => a + s.steps.filter(k => st.done[k]).length, 0);\n      const curG = this.group(contId);\n      return {\n        ...common, ...searchVals, isHome: true, isApp: false,\n        doneCount, totalCount: total, donePct: Math.round(doneCount / total * 100) + '%',\n        labTitle: L.title, hasIntro: !!L.introHtml, introEl: L.introHtml ? this.el('intro', L.introHtml) : null,\n        theoryRange: range(thU), refRange: range(rfU),\n        sessLabel: `${L.sessions.length} ${this.plural(L.sessions.length, 'сессия', 'сессии', 'сессий')}`,\n        continueKicker: doneCount || st.last ? 'Продолжить' : 'Начать',\n        continueLabel: this.label(contId),\n        onContinue: () => this.go(contId),\n        subtitle: L.subtitle, tocEl: this.el('toc', L.tocHtml),\n        theoryCnt: `${th.filter(u => st.done[u.key]).length} из ${th.length}`,\n        stepsCnt: `${stepsDone} из ${L.sessions.reduce((a, s) => a + s.steps.length, 0)} шагов`,\n        theoryCells: th.map(cell), refCells: rf.map(cell),\n        sessCells: L.sessions.map(s => {\n          const dn = s.steps.filter(k => st.done[k]).length, cur = curG === s.n;\n          return {\n            nn: String(s.n).padStart(2, '0'), title: s.title, dur: s.dur,\n            cnt: dn === s.steps.length ? 'Сессия пройдена' : `${dn} из ${s.steps.length} ${this.plural(s.steps.length, 'шага', 'шагов', 'шагов')}`,\n            bg: cur ? 'var(--fill)' : 'transparent',\n            numInk: cur ? 'var(--color-accent)' : dn === s.steps.length ? 'var(--ink)' : 'var(--faint)',\n            bars: s.steps.map(k => ({ c: st.done[k] ? 'var(--ink)' : 'var(--hair)' })),\n            onClick: () => this.go(this.posters() ? 'p:' + s.n : 'u:' + this.firstUndone(s.steps))\n          };\n        }),\n        resetAll: () => { if (confirm('Сбросить весь прогресс, ответы и таймеры?')) this.setState({ done: {}, quiz: {}, tSess: 0, tTotal: 0, running: false, last: null }); }\n      };\n    }\n\n    const at = st.at, curG = this.group(at), atKey = at[0] === 'u' ? at.slice(2) : null;\n    const groups = [{ id: 'T', label: 'Т' }, ...L.sessions.map(s => ({ id: s.n, label: String(s.n) })), { id: 'R', label: 'С' }].filter(g => this.gKeys(g.id).length);\n    const rail = groups.map((g, gi) => {\n      const keys = this.gKeys(g.id), dn = keys.filter(k => st.done[k]).length, all = dn === keys.length, cur = curG === g.id;\n      const s = typeof g.id === 'number' ? this.S[g.id] : null;\n      return {\n        label: g.label,\n        bg: cur ? 'var(--color-accent)' : all ? 'var(--ink)' : 'transparent',\n        ink: cur ? '#fff' : all ? 'var(--paper)' : 'var(--ink)',\n        border: cur ? 'var(--color-accent)' : all ? 'var(--ink)' : 'var(--muted)',\n        pct: Math.round(dn / keys.length * 100) + '%', barC: cur ? 'var(--color-accent)' : 'var(--ink)',\n        popOpen: st.pop === g.id, popTop: gi < 7 ? '0' : 'auto', popBottom: gi < 7 ? 'auto' : '0',\n        popKicker: g.id === 'T' ? `Теория · ${dn} из ${keys.length}` : g.id === 'R' ? `Справка · ${dn} из ${keys.length}` : `Сессия ${g.id} · ${s.dur} · ${dn} из ${keys.length}`,\n        popTitle: g.id === 'T' ? 'Теория' : g.id === 'R' ? 'Справка' : s.title,\n        items: keys.map(k => {\n          const u = this.U[k], d = !!st.done[k], c = k === atKey;\n          return { num: u.num, title: u.title, mark: d ? '✓' : '', bg: c ? 'var(--accent-fill)' : 'transparent', ink: c ? 'var(--accent-ink)' : d ? 'var(--muted)' : 'var(--ink)', fw: c ? 800 : 400, onClick: () => this.go('u:' + k) };\n        }),\n        onEnter: e => {\n          clearTimeout(this.popT);\n          const r = e.currentTarget.getBoundingClientRect(), low = r.top > window.innerHeight / 2;\n          this.popPos = low ? { top: 'auto', bottom: Math.max(8, window.innerHeight - r.bottom) + 'px' } : { top: r.top + 'px', bottom: 'auto' };\n          if (st.pop !== g.id) this.setState({ pop: g.id });\n        },\n        onLeave: () => { clearTimeout(this.popT); this.popT = setTimeout(() => this.setState({ pop: null }), 160); },\n        onClick: () => this.go(s ? (this.posters() && !d s.filter(k => st.done[k]).length, fu = this.firstUndone(s.steps);\n      p = {\n        n: s.n, nn: String(s.n).padStart(2, '0'), title: s.title, dur: s.dur,\n        count: `${s.steps.length} ${this.plural(s.steps.length, 'шаг', 'шага', 'шагов')} · ${dn} ${this.plural(dn, 'пройден', 'пройдено', 'пройдено')}`,\n        startLabel: dn === 0 ? `Начать с ${this.U[fu].num} →` : dn === s.steps.length ? 'Повторить с начала →' : `Продолжить с ${this.U[fu].num} →`,\n        onStart: () => this.go('u:' + (dn === s.steps.length ? s.steps[0] : fu)),\n        steps: s.steps.map(k => ({ num: this.U[k].num, title: this.U[k].title, mark: st.done[k] ? '✓' : '', onClick: () => this.go('u:' + k) }))\n      };\n    }\n    return {\n      ...common, ...searchVals, isHome: false, isApp: true, rail,\n      popTop: (this.popPos || {}).top || '0', popBottom: (this.popPos || {}).bottom || 'auto',\n      ticks: this.allKeys.map(k => ({ c: k === atKey ? 'var(--color-accent)' : st.done[k] ? 'var(--ink)' : 'var(--hair)' })),\n      groupKicker: curG === 'T' ? 'Теория · ' + range(thU) : curG === 'R' ? 'Справка · ' + range(rfU) : `Сессия ${curG} · ${sCur.dur}`,\n      groupTitle: sCur ? sCur.title : atKey ? this.U[atKey].title : '',\n      tabs: tabs.map(t => {\n        const c = t.id === at, d = t.key && st.done[t.key];\n        return { label: t.label, tip: t.tip, mark: d ? '✓' : '', under: c ? 'var(--color-accent)' : 'transparent', ink: c ? 'var(--ink)' : d ? 'var(--muted)' : 'var(--ink)', fw: c ? 800 : 400, onClick: () => this.go(t.id) };\n      }),\n      feedBg: feed ? 'var(--ink)' : 'transparent', feedInk: feed ? 'var(--paper)' : 'var(--ink)',\n      stepsBg: !feed ? 'var(--ink)' : 'transparent', stepsInk: !feed ? 'var(--paper)' : 'var(--ink)',\n      setFeed: () => { if (!feed) { this.pendingScroll = at; this.setState({ mode: 'feed' }); } },\n      setSteps: () => { if (feed) { this.pendingTop = true; this.setState({ mode: 'steps' }); } },\n      timerLabel: st.running ? 'Пауза' : st.tSess ? 'Продолжить' : 'Старт',\n      timerBg: st.running ? 'var(--color-accent)' : 'var(--ink)', timerInk: st.running ? '#fff' : 'var(--paper)',\n      toggleTimer: () => this.setState({ running: !st.running }, () => this.save()),\n      resetSess: () => this.setState({ tSess: 0 }, () => this.save()),\n      onScroll: () => { if (!feed || this.spyLock || this.raf) return; this.raf = requestAnimationFrame(() => { this.raf = null; this.spy(); }); },\n      onContentClick: e => {\n        const a = e.target.closest && e.target.closest('a'); if (!a) return;\n        const h = a.getAttribute('href') || ''; if (!h.startsWith('#')) return;\n        e.preventDefault();\n        const id = h.slice(1); let m;\n        if (/^(step-|sec-)/.test(id) && this.U[id]) this.go('u:' + id);\n        else if ((m = id.match(/^session-(\\d+)/))) this.go('p:' + m[1]);\n        else if (/^(g-|term-)/.test(id) && L.glossKey) this.go('u:' + L.glossKey);\n        else if (id === 'top') this.go('home');\n      },\n      isPosterView, p, shown, showFooter, f\n    };\n  }\n}\n<\u002Fscript>\n\n\n<script src=\"../works/js/prereq.js\"><\u002Fscript><\u002Fbody><\u002Fhtml>"
